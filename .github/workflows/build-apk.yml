name: Сборка Android APK (Теплый пол Стаса)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Позволяет запускать сборку кнопкой "Run workflow" в GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Получение исходного кода
        uses: actions/checkout@v4

      - name: ☕ Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: ⚙️ Настройка Android SDK и Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Сборка APK
        run: |
          cd android_app
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Выгрузка готового APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: WarmFloor_Stas_v1.0.0.apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Создание GitHub Release (опционально)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android_app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
