[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Автоматическое версионирование по стандарту (PROJECT_STANDARDS.md)
extra_scripts = pre:generate_version.py

; Настройки встроенного USB CDC для ESP32-C3 SuperMini
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_ldf_mode = deep+

; Жесткая фиксация версий библиотек по стандарту
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    GyverLibs/GyverTM1637 @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
    esphome/ESPAsyncWebServer-esphome @ ^3.3.0
